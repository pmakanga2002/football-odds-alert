
name: Football Odds Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Restaurer l'historique des cotes
        uses: actions/cache/restore@v5
        with:
          path: odds_state.json
          key: odds-state-${{ github.run_id }}
          restore-keys: |
            odds-state-

      - name: Verifier et lancer le detecteur
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eu
          echo "=== Verification du dossier ==="
          pwd
          ls -la
          echo "=== Version Python ==="
          python --version
          echo "=== Verification de requests ==="
          python -c "import requests; print('requests', requests.__version__)"
          echo "=== Verification du fichier ==="
          test -f detector.py
          echo "=== Verification de la syntaxe ==="
          python -m py_compile detector.py
          echo "=== Execution du detecteur ==="
          python -u detector.py

      - name: Sauvegarder l'historique des cotes
        if: always()
        uses: actions/cache/save@v5
        with:
          path: odds_state.json
          key: odds-state-${{ github.run_id }}
